---
# Claude Code reads skills from ~/.claude/skills only. Link every skill of ~/.agents/skills there,
# replacing the copies earlier versions made; Claude Code's own entries (e.g. synced/) stay.
# And no memory files: autoMemoryEnabled is off in the managed settings; remove old ones.

- name: List the skills in the agents' skill directory
  ansible.builtin.find:
    paths: "{{ aioperator_skill_dirs[0] }}"
    file_type: any
    excludes: [".*"]
  register: aioperator_agent_skills

- name: Create Claude Code's skill directory
  ansible.builtin.file:
    path: "{{ aioperator_claude_skills_dir }}"
    state: directory
    owner: "{{ aioperator_user }}"
    group: "{{ aioperator_user }}"
    mode: "0755"

- name: Check for copies where the links go
  ansible.builtin.stat:
    path: "{{ aioperator_claude_skills_dir }}/{{ item.path | basename }}"
  loop: "{{ aioperator_agent_skills.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: aioperator_claude_skill_stat

- name: Remove the copies (the skill lives in the agents' directory)
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: absent
  loop: "{{ aioperator_claude_skill_stat.results }}"
  loop_control:
    label: "{{ item.item.path | basename }}"
  when: item.stat.exists and not item.stat.islnk

- name: Link each skill for Claude Code
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ aioperator_claude_skills_dir }}/{{ item.path | basename }}"
    state: link
    force: true
    follow: false
    owner: "{{ aioperator_user }}"
    group: "{{ aioperator_user }}"
  loop: "{{ aioperator_agent_skills.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Find Claude Code memory directories
  ansible.builtin.find:
    paths: "{{ aioperator_claude_projects_dir }}"
    patterns: memory
    file_type: directory
    recurse: true
    depth: 2
  register: aioperator_claude_memory

- name: Remove them (knowledge lives in the wiki)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ aioperator_claude_memory.files }}"
  loop_control:
    label: "{{ item.path }}"
