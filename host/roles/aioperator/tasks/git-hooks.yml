---
# gitleaks plus activation of the repositories' own hooks for the operator.

- name: Create the gitleaks directory
  ansible.builtin.file:
    path: "{{ aioperator_gitleaks_dir }}"
    state: directory
    owner: "{{ aioperator_gitleaks_owner }}"
    group: "{{ aioperator_gitleaks_owner }}"
    mode: "0755"

- name: Download gitleaks (pinned version, verified checksum)
  ansible.builtin.get_url:
    url: "{{ aioperator_gitleaks_url }}"
    headers: "{{ aioperator_gitleaks_headers }}"
    dest: "{{ aioperator_gitleaks_dir }}/gitleaks.tar.gz"
    checksum: "sha256:{{ aioperator_gitleaks_sha256 }}"
    owner: "{{ aioperator_gitleaks_owner }}"
    group: "{{ aioperator_gitleaks_owner }}"
    mode: "0644"

- name: Unpack gitleaks
  ansible.builtin.unarchive:
    src: "{{ aioperator_gitleaks_dir }}/gitleaks.tar.gz"
    dest: "{{ aioperator_gitleaks_dir }}"
    remote_src: true
    include: [gitleaks]
    owner: "{{ aioperator_gitleaks_owner }}"
    group: "{{ aioperator_gitleaks_owner }}"
    creates: "{{ aioperator_gitleaks_dir }}/gitleaks"

- name: Put gitleaks on the PATH
  ansible.builtin.file:
    src: "{{ aioperator_gitleaks_dir }}/gitleaks"
    dest: "{{ aioperator_gitleaks_link }}"
    state: link
    force: true

- name: Find the checkouts that carry their own hooks (.githooks)
  ansible.builtin.find:
    paths: "{{ aioperator_workspace }}"
    patterns: .githooks
    file_type: directory
    hidden: true
    recurse: true
    depth: 2
  register: aioperator_githooks

- name: Activate .githooks in each of them  # noqa: command-instead-of-module (no git config module in ansible-core)
  become: true
  become_user: "{{ aioperator_user }}"
  ansible.builtin.shell:
    cmd: >-
      test "$(git -C {{ aioperator_hook_dir.path | dirname | quote }} config --get core.hooksPath)" = .githooks
      || { git -C {{ aioperator_hook_dir.path | dirname | quote }} config core.hooksPath .githooks && echo switched; }
  loop: "{{ aioperator_githooks.files }}"
  loop_control:
    loop_var: aioperator_hook_dir
    label: "{{ aioperator_hook_dir.path | dirname | basename }}"
  register: aioperator_hooks_switch
  changed_when: "'switched' in aioperator_hooks_switch.stdout"
