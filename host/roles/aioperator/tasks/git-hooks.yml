---
# gitleaks plus activation of the repositories' own hooks for the operator.

- name: Create the gitleaks directory
  ansible.builtin.file:
    path: "{{ aioperator_gitleaks_dir }}"
    state: directory
    owner: "{{ aioperator_gitleaks_owner }}"
    group: "{{ aioperator_gitleaks_owner }}"
    mode: "0755"

- name: Download gitleaks (pinned version, verified checksum)
  ansible.builtin.get_url:
    url: "{{ aioperator_gitleaks_url }}"
    headers: "{{ aioperator_gitleaks_headers }}"
    dest: "{{ aioperator_gitleaks_dir }}/gitleaks.tar.gz"
    checksum: "sha256:{{ aioperator_gitleaks_sha256 }}"
    owner: "{{ aioperator_gitleaks_owner }}"
    group: "{{ aioperator_gitleaks_owner }}"
    mode: "0644"

- name: Unpack gitleaks
  ansible.builtin.unarchive:
    src: "{{ aioperator_gitleaks_dir }}/gitleaks.tar.gz"
    dest: "{{ aioperator_gitleaks_dir }}"
    remote_src: true
    include: [gitleaks]
    owner: "{{ aioperator_gitleaks_owner }}"
    group: "{{ aioperator_gitleaks_owner }}"
    creates: "{{ aioperator_gitleaks_dir }}/gitleaks"

- name: Put gitleaks on the PATH
  ansible.builtin.file:
    src: "{{ aioperator_gitleaks_dir }}/gitleaks"
    dest: "{{ aioperator_gitleaks_link }}"
    state: link
    force: true

- name: Read the current hooksPath of the operator's checkouts  # noqa: command-instead-of-module
  become: true
  become_user: "{{ aioperator_user }}"
  ansible.builtin.command:
    cmd: git -C {{ aioperator_workspace }}/{{ item.key }} config --get core.hooksPath
  loop: "{{ aioperator_repo_hooks | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: aioperator_hookspaths
  changed_when: false
  failed_when: aioperator_hookspaths.rc not in [0, 1, 128]   # 1: unset, 128: no such repo

- name: Activate .githooks  # noqa: command-instead-of-module (no git config module in ansible-core)
  become: true
  become_user: "{{ aioperator_user }}"
  ansible.builtin.command:
    cmd: git -C {{ aioperator_workspace }}/{{ item.item.key }} config core.hooksPath .githooks
  loop: "{{ aioperator_hookspaths.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: item.item.value == 'githooks' and item.rc != 128 and item.stdout != '.githooks'
  changed_when: true

- name: Activate husky (sets core.hooksPath to .husky/_)
  become: true
  become_user: "{{ aioperator_user }}"
  ansible.builtin.command:
    cmd: node_modules/.bin/husky
    chdir: "{{ aioperator_workspace }}/{{ item.item.key }}"
    removes: "{{ aioperator_workspace }}/{{ item.item.key }}/node_modules/.bin/husky"
  loop: "{{ aioperator_hookspaths.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: item.item.value == 'husky' and item.rc != 128 and item.stdout != '.husky/_'
  changed_when: true
