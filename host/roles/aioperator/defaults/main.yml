---
aioperator_user: aioperator
aioperator_home: /home/aioperator
aioperator_groups: [adm, users, systemd-journal]

# Sudo whitelist, grouped into command aliases. A command without arguments
# would allow ANY arguments; "" allows none.
aioperator_sudo_aliases:
  CLAUDE_DIAG:  # read-only diagnostics, NOEXEC
    - /usr/bin/ss -tlnp
    - /usr/bin/ss -ulnp
    - /usr/bin/ss -tulnp
    - /usr/sbin/ufw status
    - /usr/sbin/ufw status verbose
    - /usr/bin/dmesg ""
    - /usr/bin/dmesg -T
    - /usr/local/bin/crictl ps
    - /usr/local/bin/crictl ps -a
    - /usr/local/bin/crictl images
    - /usr/local/bin/crictl stats
  CLAUDE_MAINT:
    - /usr/bin/apt-get update
    - /usr/bin/apt-get -y upgrade
    - /usr/bin/systemctl reset-failed
  CLAUDE_SVC:
    - /usr/bin/systemctl restart k3s
    - /usr/bin/systemctl restart tailscaled
  CLAUDE_AI:
    - /usr/bin/systemctl --user -M jaegle@ restart llama-server@router.service
    - /usr/bin/systemctl --user -M jaegle@ restart llama-q38@qwen3.8-dual.service
    - /usr/bin/systemctl --user -M jaegle@ restart whisper-server@whisper.service
    - /usr/bin/systemctl --user -M jaegle@ restart comfyui-server@comfyui.service
    - /usr/bin/systemctl --user -M jaegle@ --no-pager status *
aioperator_sudo_rules:
  - "NOPASSWD:NOEXEC: CLAUDE_DIAG"
  - "NOPASSWD: CLAUDE_MAINT, CLAUDE_SVC, CLAUDE_AI"

# Agent skills: name -> directory the symlink points to.
aioperator_skills_coding_repo: https://github.com/mrsimpson/skills-coding.git
aioperator_skills_coding_dir: "{{ aioperator_home }}/projects/mrsimpson/skills-coding"
aioperator_skills:
  commit: "{{ aioperator_skills_coding_dir }}/commit"
  tdd-with-agents: "{{ aioperator_skills_coding_dir }}/tdd-with-agents"
  claude-code-sessions: "{{ aioperator_skills_coding_dir }}/claude-code-sessions"
  commit-intents: "{{ aioperator_skills_coding_dir }}/commit-intents"
  # Working checkout of the private wiki repo; maintained by the operator, not here.
  wiki-maintenance: "{{ aioperator_home }}/projects/digitaleraluhut/homelab-wiki/skills/wiki-maintenance"
aioperator_skill_dirs:
  - "{{ aioperator_home }}/.agents/skills"
  - "{{ aioperator_home }}/.claude/skills"
