---
aioperator_user: aioperator
aioperator_home: /home/aioperator
aioperator_groups: [adm, users, systemd-journal, localai]  # localai: read /srv/localai, write lab/
aioperator_localai_user: localai

# Sudo whitelist, grouped into command aliases. A command without arguments
# would allow ANY arguments; "" allows none.
aioperator_sudo_aliases:
  AIOPERATOR_DIAG:  # read-only diagnostics, NOEXEC
    - /usr/bin/ss -tlnp
    - /usr/bin/ss -ulnp
    - /usr/bin/ss -tulnp
    - /usr/sbin/ufw status
    - /usr/sbin/ufw status verbose
    - /usr/bin/dmesg ""
    - /usr/bin/dmesg -T
    - /usr/local/bin/crictl ps
    - /usr/local/bin/crictl ps -a
    - /usr/local/bin/crictl images
    - /usr/local/bin/crictl stats
  AIOPERATOR_MAINT:
    - /usr/bin/apt-get update
    - /usr/bin/apt-get -y upgrade
    - /usr/bin/systemctl reset-failed
  AIOPERATOR_SVC:
    - /usr/bin/systemctl restart k3s
    - /usr/bin/systemctl restart tailscaled
  AIOPERATOR_AI:  # local AI service instances of user localai
    - /usr/bin/systemctl --user -M localai@ restart llama-server@router.service
    - /usr/bin/systemctl --user -M localai@ restart whisper-server@whisper.service
    - /usr/bin/systemctl --user -M localai@ restart comfyui-server@comfyui.service
    - /usr/bin/systemctl --user -M localai@ start llama-server@lab.service
    - /usr/bin/systemctl --user -M localai@ stop llama-server@lab.service
    - /usr/bin/systemctl --user -M localai@ restart llama-server@lab.service
    - /usr/bin/systemctl --user -M localai@ --no-pager status *
  # WALL-E (role walle): run, stop and inspect the apprentice and the review job.
  AIOPERATOR_WALLE:
    - /usr/bin/systemctl start walle.service
    - /usr/bin/systemctl stop walle.service
    - /usr/bin/systemctl restart walle.service
    - /usr/bin/systemctl start walle-review.service
  # Mints a 1h GitHub App installation token; no arguments allowed. No
  # NOEXEC: the helper runs openssl to sign the App JWT.
  AIOPERATOR_GITHUB:
    - /usr/local/sbin/homelab-operator-github-token ""
  # Read-only container state, run as localai. No NOEXEC: rootless podman
  # re-executes itself. The runtime dir must match the user manager's.
  AIOPERATOR_LOCALAI_READ:
    - /usr/bin/env XDG_RUNTIME_DIR\=/run/user/{{ aioperator_localai_uid }} /usr/bin/podman ps -a
    - /usr/bin/env XDG_RUNTIME_DIR\=/run/user/{{ aioperator_localai_uid }} /usr/bin/podman images
    - /usr/bin/env XDG_RUNTIME_DIR\=/run/user/{{ aioperator_localai_uid }} /usr/bin/distrobox list
# Each rule: "(runas) tags: aliases", rendered as "<user> ALL=<rule>".
aioperator_sudo_rules:
  - "(root) NOPASSWD:NOEXEC: AIOPERATOR_DIAG"
  - "(root) NOPASSWD: AIOPERATOR_MAINT, AIOPERATOR_SVC, AIOPERATOR_AI, AIOPERATOR_GITHUB, AIOPERATOR_WALLE"
  - "(localai) NOPASSWD: AIOPERATOR_LOCALAI_READ"

# Agent skills: name -> directory the symlink points to.
aioperator_skills_coding_repo: https://github.com/mrsimpson/skills-coding.git
aioperator_skills_coding_dir: "{{ aioperator_home }}/projects/mrsimpson/skills-coding"
aioperator_skills:
  commit: "{{ aioperator_skills_coding_dir }}/commit"
  tdd-with-agents: "{{ aioperator_skills_coding_dir }}/tdd-with-agents"
  claude-code-sessions: "{{ aioperator_skills_coding_dir }}/claude-code-sessions"
  commit-intents: "{{ aioperator_skills_coding_dir }}/commit-intents"
# Skills from this repository (skills/<name>), copied from the reviewed main
# that the runner applies. They do not depend on the operator's checkouts.
aioperator_repo_skills: [wiki-maintenance, workflow-handoff, train-walle]
aioperator_repo_skills_src: "{{ playbook_dir }}/../skills"
aioperator_skill_dirs:
  - "{{ aioperator_home }}/.agents/skills"
  - "{{ aioperator_home }}/.claude/skills"

# Claude Code permissions for the operator, as root-owned managed settings the
# operator cannot change itself. GitHub still enforces code-owner review, so
# "gh pr merge" only succeeds where no owner review is required.
aioperator_claude_allow:
  - "Bash(gh pr merge:*)"
# Claude Code hooks for the operator, in the same managed settings. At start and
# resume, the session gets WALL-E's status (role walle), so the operator picks
# up pending reviews and re-arms its watch after a restart.
aioperator_claude_hooks:
  SessionStart:
    - hooks:
        - type: command
          command: "test -x /usr/local/lib/walle/status && /usr/local/lib/walle/status || true"
        # What the operator keeps current: generated from the wiki pages' `upkeep`
        # frontmatter (homelab-wiki: tools/maintenance.py, pre-commit hook).
        - type: command
          command: >-
            f={{ aioperator_workspace }}/homelab-wiki/wiki/maintenance.md;
            test -r "$f" && sed -n '/^## What the operator keeps current/,/^## Pages by/p' "$f" | sed '$d' || true

# GitHub access through an org-owned GitHub App instead of a user account.
# The owner places the App's private key and IDs in this directory by hand
# (never in git: this repository is public):
#   private-key.pem  root:root 0600
#   app.env          root:root 0644  APP_ID=, INSTALLATION_ID=, BOT_LOGIN=, BOT_USER_ID=
# Until app.env exists, git and gh keep using the previous gh login.
aioperator_github_app_dir: /etc/homelab/operator-github-app
aioperator_github_repositories: [homelab, homelab-apps, local-ai, homelab-wiki, walle, digitaleraluhut.github.io]
# Requested per token; never more than the App installation grants.
# Deliberately no "workflows": GitHub then refuses any push that adds or
# changes .github/workflows/, even on branches, so only reviewed workflow
# code can run. Workflow changes come as patches the owner pushes.
aioperator_github_permissions:
  contents: write
  pull_requests: write
  issues: write
  actions: read
  checks: read
  statuses: read
# Used while the App is not configured.
aioperator_git_fallback_name: Olivers AI
aioperator_git_fallback_email: mrsimpson-ai@beimir.net

# gitleaks for the repositories' pre-commit hooks. Keep version and checksum
# in sync with .github/workflows/secret-scan.yml (linux x64 tarball).
aioperator_gitleaks_version: 8.30.1
aioperator_gitleaks_sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
aioperator_gitleaks_dir: /usr/local/lib/gitleaks/{{ aioperator_gitleaks_version }}
aioperator_gitleaks_link: /usr/local/bin/gitleaks
aioperator_gitleaks_owner: root
aioperator_gitleaks_url: >-
  https://github.com/gitleaks/gitleaks/releases/download/v{{ aioperator_gitleaks_version
  }}/gitleaks_{{ aioperator_gitleaks_version }}_linux_x64.tar.gz
aioperator_gitleaks_headers: {}

# Activate each repository's own hooks in the operator's checkouts (worktrees
# share the setting). githooks: core.hooksPath=.githooks; husky: run husky,
# which sets core.hooksPath=.husky/_ (needs node_modules).
aioperator_workspace: "{{ aioperator_home }}/projects/digitaleraluhut"
aioperator_repo_hooks:
  homelab: husky
  homelab-apps: githooks
  local-ai: githooks

# Node.js for the operator only (the repositories' CI runs Node 24; the system
# node stays as it is for everyone else). Official linux-x64 tarball, checksum
# from https://nodejs.org/dist/v<version>/SHASUMS256.txt. Linked into the
# operator's ~/.local/bin, which comes first on its PATH (claude-remote.service).
aioperator_node_version: 24.22.2
aioperator_node_sha256: 48cc0e21e048790e54c0cf5749c2725005313d652651c40b7a21feb9697aaf75
aioperator_node_dir: /usr/local/lib/nodejs/{{ aioperator_node_version }}
aioperator_node_owner: root
aioperator_node_link_dir: "{{ aioperator_home }}/.local/bin"
aioperator_node_url: >-
  https://nodejs.org/dist/v{{ aioperator_node_version }}/node-v{{ aioperator_node_version }}-linux-x64.tar.xz
