---
- name: Create the localai system user
  ansible.builtin.user:
    name: "{{ localai_user }}"
    comment: Local AI services
    system: true
    home: "{{ localai_home }}"
    create_home: true
    shell: /bin/bash   # distrobox enters with the user's shell
    password: "!"
    groups: "{{ localai_groups }}"
    append: true
  register: localai_account

- name: Keep the localai home private to the user and its group
  ansible.builtin.file:
    path: "{{ localai_home }}"
    state: directory
    owner: "{{ localai_user }}"
    group: "{{ localai_user }}"
    mode: "0750"

- name: Assign subordinate UID/GID ranges for rootless containers
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: "^{{ localai_user }}:"
    line: "{{ localai_user }}:{{ localai_subid_start }}:{{ localai_subid_count }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop: [/etc/subuid, /etc/subgid]

- name: Start the localai user manager at boot (linger)
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ localai_user }}
    creates: /var/lib/systemd/linger/{{ localai_user }}

- name: Create data and config directories
  ansible.builtin.file:
    path: "{{ localai_home }}/{{ item }}"
    state: directory
    owner: "{{ localai_user }}"
    group: "{{ localai_user }}"
    mode: "0750"
  loop: "{{ localai_data_dirs + ['.config', '.config/llama-cpp', '.config/systemd', '.config/systemd/user'] }}"

- name: Create the podman config directory
  ansible.builtin.file:
    path: "{{ localai_home }}/.config/containers"
    state: directory
    owner: "{{ localai_user }}"
    group: "{{ localai_user }}"
    mode: "0750"

# localai is a system user: journald keeps no per-user journal for it, so
# container logs in journald are unreadable for localai itself. distrobox
# enter waits for "container_setup_done" in the container log and would hang
# forever. Applies to containers created after this file exists.
- name: Let rootless podman log to files
  ansible.builtin.copy:
    dest: "{{ localai_home }}/.config/containers/containers.conf"
    owner: "{{ localai_user }}"
    group: "{{ localai_user }}"
    mode: "0644"
    content: |
      # Managed by Ansible (digitaleraluhut/homelab host/), do not edit.
      [containers]
      log_driver = "k8s-file"

# force: the pinned ref is the truth; local edits on the host are reverted.
- name: Check out the pinned local-ai ref
  become: true
  become_user: "{{ localai_user }}"
  ansible.builtin.git:
    repo: "{{ localai_repo }}"
    dest: "{{ localai_checkout }}"
    version: "{{ localai_ref }}"
    force: true
  notify:
    - Run model sync
    - Restart local-ai services

# The container wrappers read presets from ~/.config/llama-cpp (container home
# = host home). Without this, preset changes only arrive when a container is
# recreated. File by file: a remote_src directory copy reports "changed" on
# every run, which would restart the services hourly.
- name: Find presets in the checkout
  ansible.builtin.find:
    paths: "{{ localai_checkout }}/configs"
    patterns: ["*.ini", "*.jinja"]
  register: localai_presets

- name: Sync presets into the container config directory
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ localai_home }}/.config/llama-cpp/{{ item.path | basename }}"
    remote_src: true
    owner: "{{ localai_user }}"
    group: "{{ localai_user }}"
    mode: "0640"
  loop: "{{ localai_presets.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  notify: Restart local-ai services

- name: Install unit templates
  ansible.builtin.copy:
    src: "{{ localai_checkout }}/systemd/{{ item }}"
    dest: "{{ localai_home }}/.config/systemd/user/{{ item }}"
    remote_src: true
    owner: "{{ localai_user }}"
    group: "{{ localai_user }}"
    mode: "0644"
  loop: "{{ localai_unit_files }}"
  notify: Restart local-ai services

- name: Install unit drop-ins
  ansible.builtin.copy:
    src: "{{ localai_checkout }}/systemd/{{ item }}/"
    dest: "{{ localai_home }}/.config/systemd/user/{{ item }}/"
    remote_src: true
    owner: "{{ localai_user }}"
    group: "{{ localai_user }}"
    mode: "0644"
    directory_mode: "0755"
  loop: "{{ localai_unit_dropins }}"
  notify: Restart local-ai services

- name: Create the lab preset directory (group-writable)
  ansible.builtin.file:
    path: "{{ localai_lab_dir }}"
    state: directory
    owner: "{{ localai_user }}"
    group: "{{ localai_user }}"
    mode: "2770"

- name: Create the lab drop-in directory
  ansible.builtin.file:
    path: "{{ localai_home }}/.config/systemd/user/{{ localai_lab_instance }}.d"
    state: directory
    owner: "{{ localai_user }}"
    group: "{{ localai_user }}"
    mode: "0755"

# distrobox passes the environment into the container, so the in-box
# launcher reads lab/lab.ini instead of ~/.config/llama-cpp.
- name: Point the lab instance at the lab preset and its own port
  ansible.builtin.copy:
    dest: "{{ localai_home }}/.config/systemd/user/{{ localai_lab_instance }}.d/lab.conf"
    owner: "{{ localai_user }}"
    group: "{{ localai_user }}"
    mode: "0644"
    content: |
      # Managed by Ansible (digitaleraluhut/homelab host/), do not edit.
      [Service]
      Environment=LLAMA_CONFIG_DIR={{ localai_lab_dir }}
      Environment=LLAMA_SERVER_PORT={{ localai_lab_port }}

- name: Install the model sync unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/localai-model-sync.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (digitaleraluhut/homelab host/), do not edit.
      [Unit]
      Description=Download missing local-ai models (models/catalog.yaml)
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=oneshot
      User={{ localai_user }}
      ExecStart=/usr/bin/python3 {{ localai_checkout }}/scripts/model_catalog.py sync --models-dir {{ localai_home }}/models
      TimeoutStartSec=infinity
      Nice=10
      IOSchedulingClass=idle
  notify: Run model sync

- name: Install the model sync timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/localai-model-sync.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (digitaleraluhut/homelab host/), do not edit.
      [Unit]
      Description=Periodic local-ai model sync

      [Timer]
      OnCalendar={{ localai_model_sync_timer }}
      Persistent=true
      RandomizedDelaySec=1h

      [Install]
      WantedBy=timers.target

- name: Enable the model sync timer
  ansible.builtin.systemd_service:
    name: localai-model-sync.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Flush handlers before managing the services
  ansible.builtin.meta: flush_handlers

- name: Enable and start the service instances
  become: true
  become_user: "{{ localai_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ localai_account.uid }}"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  loop: "{{ localai_instances }}"
