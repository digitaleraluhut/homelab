---
# Only while the services are enabled; before the cutover nothing runs.
- name: Restart local-ai services
  become: true
  become_user: "{{ localai_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ localai_account.uid }}"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    daemon_reload: true
    state: restarted
  loop: "{{ localai_instances }}"
  when: localai_services_enabled
