---
- name: Restart local-ai services
  become: true
  become_user: "{{ localai_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ localai_account.uid }}"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    daemon_reload: true
    state: restarted
  loop: "{{ localai_instances }}"

- name: Run model sync
  ansible.builtin.systemd_service:
    name: localai-model-sync.service
    state: started
    daemon_reload: true
    no_block: true
