---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart walle-fetch
  ansible.builtin.systemd_service:
    name: walle-fetch.service
    state: restarted
    daemon_reload: true

- name: Restart walle-kube
  ansible.builtin.systemd_service:
    name: walle-kube.service
    state: restarted
    daemon_reload: true

- name: Restart walle-kube-bridge
  ansible.builtin.systemd_service:
    name: walle-kube-bridge.service
    state: restarted
    daemon_reload: true
