---
- name: Create the WALL-E system user (no login, no sudo)
  ansible.builtin.user:
    name: "{{ walle_user }}"
    comment: WALL-E apprentice,,,
    system: true
    shell: /usr/sbin/nologin
    home: "{{ walle_home }}"
    create_home: false

- name: Let the operator read WALL-E's work and answer it
  ansible.builtin.user:
    name: "{{ walle_reviewer }}"
    groups: ["{{ walle_user }}"]
    append: true

- name: Create the WALL-E root directory
  ansible.builtin.file:
    path: "{{ walle_root }}"
    state: directory
    owner: root
    group: "{{ walle_user }}"
    mode: "0750"

- name: Create the shared directories
  ansible.builtin.file:
    path: "{{ walle_root }}/{{ item.key }}"
    state: directory
    owner: "{{ item.value.owner }}"
    group: "{{ walle_user }}"
    mode: "{{ item.value.mode }}"
  loop: "{{ walle_dirs | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Create the kubeconfig directory (file placed by the owner)
  ansible.builtin.file:
    path: "{{ walle_kubeconfig_dir }}"
    state: directory
    owner: root
    group: "{{ walle_user }}"
    mode: "0750"

- name: Create WALL-E's home (state, pi config, sessions)
  ansible.builtin.file:
    path: "{{ walle_home }}"
    state: directory
    owner: "{{ walle_user }}"
    group: "{{ walle_user }}"
    mode: "0700"

# Git refuses repositories owned by another user unless they are listed.
- name: Install WALL-E's git configuration
  ansible.builtin.template:
    src: walle-gitconfig.j2
    dest: "{{ walle_home }}/.gitconfig"
    owner: root
    group: "{{ walle_user }}"
    mode: "0644"

- name: Install the units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [walle.service, walle-review.service, walle-review.path]
  notify: Reload systemd

- name: Flush handlers before switching units
  ansible.builtin.meta: flush_handlers

# Only the enabled state is managed. While WALL-E is off, Ansible does not stop
# a run the operator started by hand.
- name: Switch the WALL-E service on or off
  ansible.builtin.systemd_service:
    name: walle.service
    enabled: "{{ walle_enabled }}"
    state: "{{ 'started' if walle_enabled else omit }}"

- name: Switch the review trigger on or off
  ansible.builtin.systemd_service:
    name: walle-review.path
    enabled: "{{ walle_review_enabled }}"
    state: "{{ 'started' if walle_review_enabled else 'stopped' }}"
