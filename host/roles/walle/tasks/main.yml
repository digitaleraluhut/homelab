---
- name: Create the WALL-E system user (no login, no sudo)
  ansible.builtin.user:
    name: "{{ walle_user }}"
    comment: WALL-E apprentice,,,
    system: true
    shell: /usr/sbin/nologin
    home: "{{ walle_home }}"
    create_home: false

- name: Let the operator read WALL-E's work and answer it
  ansible.builtin.user:
    name: "{{ walle_reviewer }}"
    groups: ["{{ walle_user }}"]
    append: true

- name: Create the WALL-E root directory
  ansible.builtin.file:
    path: "{{ walle_root }}"
    state: directory
    owner: root
    group: "{{ walle_user }}"
    mode: "0750"

- name: Create the shared directories
  ansible.builtin.file:
    path: "{{ walle_root }}/{{ item.key }}"
    state: directory
    owner: "{{ item.value.owner }}"
    group: "{{ walle_user }}"
    mode: "{{ item.value.mode }}"
  loop: "{{ walle_dirs | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# Holds WALL-E's kube token: only systemd (root) reads it and hands it to
# walle-kube.service and walle-fetch.service as a credential. WALL-E and the
# operator (group walle) cannot read it.
- name: Create the user of the cluster proxy (holds the token at run time)
  ansible.builtin.user:
    name: "{{ walle_kube_user }}"
    comment: WALL-E cluster proxy,,,
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

- name: Create the kubeconfig directory (file placed by the owner)
  ansible.builtin.file:
    path: "{{ walle_kubeconfig_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Look for the kubeconfig
  ansible.builtin.stat:
    path: "{{ walle_kubeconfig_dir }}/kubeconfig"
  register: walle_kubeconfig_file

- name: Keep the kubeconfig readable by root only
  ansible.builtin.file:
    path: "{{ walle_kubeconfig_dir }}/kubeconfig"
    owner: root
    group: root
    mode: "0600"
  when: walle_kubeconfig_file.stat.exists

- name: Create WALL-E's home (state, pi config, sessions)
  ansible.builtin.file:
    path: "{{ walle_home }}"
    state: directory
    owner: "{{ walle_user }}"
    group: "{{ walle_user }}"
    mode: "0700"

# Git refuses repositories owned by another user unless they are listed.
- name: Install WALL-E's git configuration
  ansible.builtin.template:
    src: walle-gitconfig.j2
    dest: "{{ walle_home }}/.gitconfig"
    owner: root
    group: "{{ walle_user }}"
    mode: "0644"

# Wiki runbooks (written for the operator) set KUBECONFIG=~/.kube/config. For WALL-E that path is its
# token-less proxy kubeconfig too, so a copied command reaches the cluster instead of failing.
- name: Create WALL-E's ~/.kube
  ansible.builtin.file:
    path: "{{ walle_home }}/.kube"
    state: directory
    owner: root
    group: "{{ walle_user }}"
    mode: "0755"

- name: Point WALL-E's ~/.kube/config at its proxy kubeconfig
  ansible.builtin.file:
    src: "{{ walle_kube_kubeconfig }}"
    dest: "{{ walle_home }}/.kube/config"
    state: link
    force: true
    owner: root
    group: "{{ walle_user }}"

- name: Create the directory for WALL-E's host helpers
  ansible.builtin.file:
    path: /usr/local/lib/walle
    state: directory
    owner: root
    group: root
    mode: "0755"

# Read by the operator's SessionStart hook (aioperator_claude_hooks).
- name: Install the status script for the operator's sessions
  ansible.builtin.template:
    src: walle-status.sh.j2
    dest: /usr/local/lib/walle/status
    owner: root
    group: root
    mode: "0755"

- name: Install the GET-only web proxy
  ansible.builtin.copy:
    src: walle-fetch.py
    dest: /usr/local/lib/walle/walle-fetch.py
    owner: root
    group: root
    mode: "0755"
  notify: Restart walle-fetch

- name: Install the cluster bridge
  ansible.builtin.copy:
    src: walle-kube-bridge.py
    dest: /usr/local/lib/walle/walle-kube-bridge.py
    owner: root
    group: root
    mode: "0755"
  notify: Restart walle-kube-bridge

- name: Install WALL-E's kubeconfig (no token; points at the bridge)
  ansible.builtin.template:
    src: walle-kubeconfig.j2
    dest: "{{ walle_kube_kubeconfig }}"
    owner: root
    group: root
    mode: "0644"

- name: Install the units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [walle.service, walle-review.service, walle-review.path, walle-mirrors.service, walle-mirrors.timer]
  notify: Reload systemd

# The services WALL-E reaches the world through restart on change.
- name: Install the units of the web proxy and the cluster access
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [walle-fetch.service, walle-kube.service, walle-kube-bridge.service]
  notify: "Restart {{ item | replace('.service', '') }}"

- name: Flush handlers before switching units
  ansible.builtin.meta: flush_handlers

# Only the enabled state is managed. While WALL-E is off, Ansible does not stop
# a run the operator started by hand.
- name: Switch the WALL-E service on or off
  ansible.builtin.systemd_service:
    name: walle.service
    enabled: "{{ walle_enabled }}"
    state: "{{ 'started' if walle_enabled else omit }}"

- name: Switch the review trigger on or off
  ansible.builtin.systemd_service:
    name: walle-review.path
    enabled: "{{ walle_review_enabled }}"
    state: "{{ 'started' if walle_review_enabled else 'stopped' }}"

# Unlike the service, the mirrors are harmless to keep current: always on.
- name: Keep the mirrors current
  ansible.builtin.systemd_service:
    name: walle-mirrors.timer
    enabled: true
    state: started

# Web access is harmless to keep on (GET only, screened); WALL-E reaches it
# through its tool web_get.
- name: Keep the web proxy running
  ansible.builtin.systemd_service:
    name: walle-fetch.service
    enabled: true
    state: started

# Read-only cluster access; walle-kube.service is skipped (condition) until the
# owner has placed the kubeconfig.
- name: Keep WALL-E's cluster access running
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [walle-kube.service, walle-kube-bridge.service]
