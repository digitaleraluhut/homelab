---
# Host configuration for flinker. Applied by the runner (roles/runner) as root
# from digitaleraluhut/homelab main. See host/README.md.
- name: Configure the homelab host
  hosts: homelab
  gather_facts: true
  roles:
    - role: runner
      tags: [runner]
    - role: localai
      tags: [localai]
    - role: k3s-kubectl
      tags: [k3s-kubectl]
    - role: aioperator
      tags: [aioperator]
    - role: timeshift
      tags: [timeshift]
