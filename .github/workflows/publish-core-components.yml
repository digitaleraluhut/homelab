name: Publish @mrsimpson/homelab-core-components

on:
  push:
    branches: [main]
    paths:
      - "packages/core/components/**"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      # npm trusted publishing (OIDC): npm trusts this workflow + environment, no NPM_TOKEN secret.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci
        working-directory: packages/core/components

      - name: Build
        run: npm run build
        working-directory: packages/core/components

      # main is protected (PRs only), so the version bump is no longer committed.
      # package.json holds the minimum version (bump major/minor there by hand);
      # CI publishes max(package.json, latest on npm + 1 patch).
      - name: Compute next version
        working-directory: packages/core/components
        run: |
          NAME=$(node -p "require('./package.json').name")
          PUBLISHED=$(npm view "$NAME" version 2>/dev/null || echo 0.0.0)
          VERSION=$(node -e '
            const [p, l] = process.argv.slice(1).map(v => v.split(".").map(Number));
            const next = [l[0], l[1], l[2] + 1];
            const cmp = p[0] - next[0] || p[1] - next[1] || p[2] - next[2];
            console.log((cmp > 0 ? p : next).join("."));
          ' "$(node -p "require('./package.json').version")" "$PUBLISHED")
          echo "Publishing $NAME@$VERSION (npm had $PUBLISHED)"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Trusted publishing needs npm >= 11.5.1 (Node 24 ships it); provenance is attached automatically.
      - name: Publish
        working-directory: packages/core/components
        run: |
          npm -v
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a==11&&(b>5||(b==5&&c>=1)))?0:1)' "$(npm -v)" \
            || { echo "npm $(npm -v) is too old for trusted publishing"; exit 1; }
          npm publish
