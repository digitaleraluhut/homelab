name: Host config (Ansible)

# Lints the host playbook and validates the rendered sudoers file. The host
# itself pulls main (host/README.md); nothing here touches the host.

on:
  pull_request:
    paths:
      - "host/**"
      - ".github/workflows/host-ansible.yml"
  push:
    branches: [main]
    paths:
      - "host/**"
      - ".github/workflows/host-ansible.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4

      # Same ansible-core line as Ubuntu 24.04's apt package on the host.
      - name: Install ansible-core and ansible-lint
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'ansible-core>=2.16,<2.17' ansible-lint
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Check mode file
        run: grep -qxE 'check|apply' mode

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax check
        run: ansible-playbook site.yml --syntax-check

      - name: Render and validate sudoers
        run: ansible-playbook tests/render-sudoers.yml

      - name: Render GitHub App helpers and derive the git identity
        run: ansible-playbook tests/github-app.yml -e out="$RUNNER_TEMP/github-app"

      - name: Timeshift excludes (adds missing, idempotent)
        run: ansible-playbook tests/timeshift-excludes.yml

      - name: gitleaks and hook activation
        run: ansible-playbook tests/git-hooks.yml -e out="$RUNNER_TEMP/git-hooks" -e ansible_become=false

      - name: Skills copied from skills/
        run: ansible-playbook tests/repo-skills.yml -e out="$RUNNER_TEMP/repo-skills"

      - name: Workspace instructions (AGENTS.md)
        run: ansible-playbook tests/workspace-agents.yml -e out="$RUNNER_TEMP/workspace-agents"

      - name: Node.js for the operator
        run: ansible-playbook tests/node.yml -e out="$RUNNER_TEMP/node"

      - name: WALL-E units and git configs
        run: ansible-playbook tests/walle.yml -e out="$RUNNER_TEMP/walle"
